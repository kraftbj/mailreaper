<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #1a1a2e;
      --bg-secondary: #16213e;
      --text: #e0e0e0;
      --text-muted: #8888aa;
      --accent: #e74c3c;
      --accent-green: #27ae60;
      --border: #2a2a4a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      min-width: 420px;
    }

    body {
      width: 420px;
      max-height: 500px;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }

    .header img { width: 24px; height: 24px; }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.active { background: var(--accent-green); }
    .status-dot.inactive { background: var(--text-muted); }
    .status-dot.scanning { background: var(--accent); animation: pulse 1s infinite; }
    .status-dot.error { background: var(--accent); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1px;
      background: var(--border);
      border-bottom: 1px solid var(--border);
    }

    .stat {
      background: var(--bg);
      padding: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .info-rows {
      padding: 6px 16px;
      border-bottom: 1px solid var(--border);
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      font-size: 12px;
    }

    .info-row .label { color: var(--text-muted); }

    .activity {
      padding: 6px 16px;
      border-bottom: 1px solid var(--border);
    }

    .activity h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .activity-item {
      display: flex;
      gap: 8px;
      padding: 3px 0;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }

    .activity-item:last-child { border: none; }

    .activity-icon {
      width: 16px;
      text-align: center;
      flex-shrink: 0;
    }

    .activity-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .activity-time {
      color: var(--text-muted);
      font-size: 11px;
      flex-shrink: 0;
    }

    .empty-state {
      text-align: center;
      padding: 16px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .undo-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      cursor: pointer;
      padding: 0 4px;
      flex: none;
      text-decoration: underline;
    }

    .undo-btn:hover { color: var(--text); }

    .activity-undone { opacity: 0.4; text-decoration: line-through; }

    .msg-info-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 11px;
      color: var(--text-muted);
      padding: 2px 0;
    }

    .msg-info-item .info-icon { flex-shrink: 0; width: 14px; text-align: center; }
    .msg-info-item .info-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .actions {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
    }

    button {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: var(--border); }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    button.primary:hover { background: #c0392b; }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon-32.svg" alt="">
    <h1>MailReaper</h1>
    <span id="statusDot" class="status-dot inactive"></span>
  </div>

  <div id="scanProgress" style="display:none; padding: 4px 16px; font-size: 12px; border-bottom: 1px solid var(--border);">
    <div style="display:flex; justify-content:space-between; margin-bottom: 2px;">
      <span>Scanning...</span>
      <span id="progressText">0 / 0</span>
    </div>
    <div style="background: var(--border); border-radius: 3px; height: 4px; overflow: hidden;">
      <div id="progressBar" style="background: var(--accent); height: 100%; width: 0%; transition: width 0.3s;"></div>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="statExpired">—</div>
      <div class="stat-label">Expired</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statProcessed">—</div>
      <div class="stat-label">Scanned</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="statErrors">—</div>
      <div class="stat-label">Errors</div>
    </div>
  </div>

  <div class="info-rows">
    <div class="info-row">
      <span class="label">Last scan</span>
      <span id="lastScan">Never</span>
    </div>
    <div class="info-row">
      <span class="label">Next scan</span>
      <span id="nextScan">—</span>
    </div>
    <div class="info-row">
      <span class="label">LLM Provider</span>
      <span id="llmProvider">None</span>
    </div>
    <div class="info-row" id="errorRow" style="display:none">
      <span class="label">Error</span>
      <span id="lastError" style="color:#e74c3c">—</span>
    </div>
  </div>

  <div class="activity">
    <h3>Recent Activity</h3>
    <div id="activityList">
      <div class="empty-state">No activity yet</div>
    </div>
  </div>

  <div id="selectedMessage" style="display:none; padding: 6px 16px; border-bottom: 1px solid var(--border);">
    <h3 style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 4px;">Selected Message</h3>
    <div id="selectedSubject" style="font-size: 12px; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title=""></div>
    <div id="messageInfo" style="display: none; margin-bottom: 4px;"></div>
    <div style="display: flex; gap: 6px; margin-bottom: 4px;">
      <button id="btnMarkReceipt" style="flex: none; padding: 4px 8px; font-size: 11px;">Mark as Receipt</button>
      <button id="btnMarkExpired" style="flex: none; padding: 4px 8px; font-size: 11px;">Mark as Expired</button>
      <select id="expiryPreset" style="flex: 1; padding: 4px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg-secondary); color: var(--text); font-size: 11px;">
        <option value="1">1 hour</option>
        <option value="3">3 hours</option>
        <option value="24" selected>1 day</option>
        <option value="72">3 days</option>
        <option value="168">7 days</option>
        <option value="720">30 days</option>
      </select>
      <button id="btnSetExpiry" style="flex: none; padding: 4px 8px; font-size: 11px;">Set Expiry</button>
    </div>
    <div id="selectedStatus" style="font-size: 11px; color: var(--accent-green); display: none;"></div>
  </div>

  <div class="actions" style="padding: 8px 16px;">
    <button class="primary" id="btnScan" style="padding: 6px 12px;">Scan Now</button>
    <button id="btnDiagnose" style="padding: 6px 12px;">Diagnose</button>
    <button id="btnSettings" style="padding: 6px 12px;">Settings</button>
  </div>

  <div id="diagOutput" style="display:none; padding: 8px 16px; font-size: 11px; font-family: monospace; white-space: pre-wrap; color: var(--text-muted); max-height: 300px; overflow-y: auto; border-top: 1px solid var(--border);"></div>

  <script src="popup.js" type="module"></script>
</body>
</html>
