<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- Scythe handle -->
  <line x1="85" y1="30" x2="45" y2="100" stroke="#8b8b8b" stroke-width="5" stroke-linecap="round"/>
  <!-- Scythe blade -->
  <path d="M 85 30 Q 60 15 40 30 Q 25 42 35 55" stroke="#c0c0c0" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Envelope body -->
  <rect x="25" y="55" width="55" height="38" rx="3" fill="#e74c3c" opacity="0.9"/>
  <!-- Envelope flap -->
  <path d="M 25 55 L 52.5 75 L 80 55" fill="#c0392b" opacity="0.9"/>
  <!-- Clock overlay -->
  <circle cx="75" cy="80" r="16" fill="#2c3e50" stroke="#ecf0f1" stroke-width="2"/>
  <line x1="75" y1="80" x2="75" y2="70" stroke="#ecf0f1" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="80" x2="83" y2="83" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/>
  <circle cx="75" cy="80" r="2" fill="#ecf0f1"/>
</svg>
